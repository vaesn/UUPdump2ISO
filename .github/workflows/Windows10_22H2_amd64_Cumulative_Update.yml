name: Windows10_22H2_amd64_Cumulative_Update

on: workflow_dispatch
#on: [push, pull_request]

env:
  Build_VERSION: '19045.7663'
  FILE_NAME: Windows10_22H2_amd64_Cumulative_Update

jobs:
  Windows10_22H2_amd64_Cumulative_Update:
    runs-on: windows-latest

    steps:

    # 检出本仓库
    - name: Checkout repository
      uses: actions/checkout@v5

    # 制作ISO
    - name: UUP dump WinISO
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        dir
        uup_download_windows.cmd

    # 查看目录
    - name: dir dir
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        dir

    # 打包
    - name: Package binaries
      run: |
      
        7z a -t7z -v1536M -mx=9 zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z ./${{env.FILE_NAME}}/*.iso

    # 上传镜像
    - uses: actions/upload-artifact@v4
      with:
        name: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}
        path: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*

    # 发布镜像
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{env.FILE_NAME}}-${{env.Build_VERSION}}
        release_name: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}
        files: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*
