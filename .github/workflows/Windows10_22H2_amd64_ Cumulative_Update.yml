name: Windows10_22H2_amd64_Cumulative_Update

on: workflow_dispatch

permissions:
  contents: write

env:
  Build_VERSION: '19045.7663'
  FILE_NAME: Windows10_22H2_amd64_Cumulative_Update
  
jobs:
  Windows10_22H2_amd64_Cumulative_Update:
    runs-on: windows-latest

    steps:
    - name: Generate Timestamp
      id: time
      shell: pwsh
      run: |
        $timestamp = Get-Date -Format "yyyyMMddHHmm"
        echo "timestamp=$($timestamp.Trim())" >> $env:GITHUB_OUTPUT
        
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: UUP dump WinISO
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        echo =====Before 当前目录=====
        cd
        echo =====Before 当前目录下所有文件=====
        dir
        echo ============== Running ==============
        uup_download_windows.cmd
        echo ============== Execution completed ==============
        echo =====After 当前目录 =====
        cd
        echo =====After 当前目录下所有文件 =====
        dir

    - name: Multi-volume Compression
      run: |
        7z a -t7z -v1850M -mx=0 zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z ./${{env.FILE_NAME}}/*.iso

    - name: Execution completed
      shell: cmd
      run: |
        cd ${{env.FILE_NAME}}
        echo =====当前目录=====
        cd
        echo =====当前目录下所有文件=====
        dir

    - uses: actions/upload-artifact@v4
      with:
        name: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}
        path: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{env.FILE_NAME}}
        overwrite_files: true
        body: |
            ## 🚀 Automated Release
            - **Product**: ${{ env.FILE_NAME }}
            - **Version**: ${{env.Build_VERSION}}
            - **Build Date**: ${{ steps.time.outputs.timestamp }}
            ---
            > ⚠️ **Note**: This is a multi-volume archive (.7z.001, .7z.002...). Please download all parts before extracting.
                   
        fail_on_unmatched_files: true
        name: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}
        files: zh-cn_${{env.FILE_NAME}}-${{env.Build_VERSION}}.7z*


