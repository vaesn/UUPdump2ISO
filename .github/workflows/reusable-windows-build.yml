name: reusable-windows-build

# ==========================================
# 并发控制
# ==========================================
#concurrency:
#  group: ${{ inputs.file_name }}
#  cancel-in-progress: true
on:
  workflow_call:
    inputs:
      # 对应原 FILE_NAME
      file_name:
        description: '基础文件/目录名 (对应原 FILE_NAME)'
        required: true
        type: string
        #default: ''
      
      # 对应原 force_version
      force_version:
        description: '强制指定版本号 (留空则自动提取)'
        required: false
        type: string
        #default: ''
      
      # 对应原 VOLUME_SIZE
      volume_size:
        description: '分卷大小 (对应原 VOLUME_SIZE)'
        required: false
        type: string
        default: '1536M'
      
      # 对应原 BUILD_TIMEOUT
      build_timeout:
        description: '构建超时时间 (分钟, 对应原 BUILD_TIMEOUT)'
        required: false
        type: number
        default: 300
      
      # 对应原 COMPRESS_THREADS
      compress_threads:
        description: '压缩线程数 (对应原 COMPRESS_THREADS)'
        required: false
        type: number
        default: 2

    # Secrets 通常不需要显式声明，除非需要特殊权限，但 GITHUB_TOKEN 默认可用
    secrets:
      gh_token:
        description: 'GitHub Token (用于发布 Release)'
        required: false

